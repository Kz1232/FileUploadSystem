<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>This is file upload System</h1>
    <p>Here you can upload text files and its output will be printed in console </p>
    <input type="file" name="file_1" id="file_1">
    <p id="text_preview"></p>
    <p>Here you can upload image file and its preview will be shown below </p>
    <input type="file" name="Image_file" id="image_file">
    <div>
        <img id="image_preview" style="max-width: 300px;">
    </div>
    <button id="imageDownBtn">
        click here to download preview image
    </button>
    <br>
    <br>
    <br>
    <p>This button let's you download the blob file generated on the web</p>
    <button id="downBtn">
        Click to download
    </button>
    <br>
    <br>
    <div id="dropZone" style="border:1px dashed black;padding:20px;text-align:center;">Drag Files here</div>
    <br>
    <button hidden="true" id="hiddenDownBtn">
        Click here to download dropped file
    </button>




    <script>

        // Creating blob file on runtime and providing downloading feature here 
        const downloadBtn = document.getElementById("downBtn");

        downloadBtn.addEventListener("click", ()=> {
            const blob = new Blob(["Hello World!"], { type: "text/plain"});
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = "example.txt";
            a.click();

            URL.revokeObjectURL(url); // Clean up
        })

        // File preview related js here 

        const file_pointer = document.getElementById("file_1");
        const text_preview = document.getElementById("text_preview");
        file_pointer.addEventListener("change", managefile);
        function managefile(e) {
            const selectedFile = e.target.files[0];

            const reader = new FileReader();
            console.log(reader.readyState);
            reader.onload = () => {
                console.log(reader.readyState);
                console.log(reader.result);
                text_preview.innerText = reader.result;
            };

            reader.onerror = () => {
                console.error("Error reading file:", reader.error);
            };

            reader.readAsText(selectedFile);

        };


        // Image preview related js here 

        const image_file_taking_element = document.getElementById("image_file");
        const image_file_element = document.getElementById("image_preview");
        const imageDownBtn = document.getElementById("imageDownBtn");

        let selectedImage = null;

        image_file_taking_element.addEventListener("change", (e) => {
            selectedImage = e.target.files[0];

            if (!selectedImage) return;
            
            const reader = new FileReader();

            reader.onload = () => {
                image_file_element.src = reader.result;
            };

            reader.error = () => {
                console.log("Error while reading image", reader.error);
            };

            reader.readAsDataURL(selectedImage);
        });



        imageDownBtn.addEventListener("click",(e) => {
            if (!selectedImage) return;

            const url = URL.createObjectURL(selectedImage);
            const a = document.createElement("a");
            a.href = url;
            a.download = selectedImage.name;

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            URL.revokeObjectURL(url);

        })


        //Drag file and download buttons here 
        const dropZone = document.getElementById("dropZone");
        const hiddenDownBtn = document.getElementById("hiddenDownBtn");
        let droppedFile = null;


        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.style.backgroundColor = "#e8dfdf";
        });

        dropZone.addEventListener("dragleave",() => {
            dropZone.style.backgroundColor = "#ffffff";
        });

        dropZone.addEventListener("drop", event =>{
            event.preventDefault();
            dropZone.style.backgroundColor = "red";

            droppedFile = event.dataTransfer.files[0];
            console.log('your dropped filename is: '+droppedFile.name);
            hiddenDownBtn.hidden = false;
        });

        // Baking the dragged file to be downloaded
        hiddenDownBtn.addEventListener("click", (e) =>{
            const a = document.createElement("a");
            const url = URL.createObjectURL(droppedFile);
            a.href = url;
            a.download = "droppefile" || droppedFile.name;
            a.click();
            URL.revokeObjectURL(url);
        });

    </script>
</body>

</html>
